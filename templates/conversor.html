{% extends 'base.html' %}
{% block title %}
    Conversor

{% endblock %}

{% block content %}

<div class="container">


    <div class="card-form">

        <h1>Conversor</h1>
        <form action="/conversor" method="POST">

            <label>Conversão</label>

            <select name="tipo">

                <option value="kg_ton">
                    Kg → Toneladas
                </option>

                <option value="ton_kg">
                    Toneladas → Kg
                </option>

                <option value="ha_alq">
                    Hectares → Alqueire Paulista
                </option>

            </select>
            <label>Valor</label>

            <input type="number" step="0.01" name="valor" required>

            <button type="submit">
                Calcular
            </button>
        </form>

    </div>

    {% if erro %}
        <p class="erro">
            {{ erro }}
        </p>
    {% endif %}

{% if resultado %}

<div class="resultado">

    <h3>Resultado da Simulação</h3>

    <p>
        <strong>
            {{ "%.2f"|format(resultado) }}
        </strong>
    </p>

</div>

{% endif %}


<a class="btn-voltar" href="/">
    ← Voltar ao Dashboard
</a>

{% endblock %}
