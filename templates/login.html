{% extends 'base.html' %}

{% block title %}
    login
{% endblock %}

{% block content %}

<h1>Login</h1>

<form action="/login" method="POST">

    <label>Nome:</label>
    <input type="text" name="nome" required value="{{ nome }}">

    <label>Senha:</label>
    <input type="password" name="senha" required value="{{ senha }}">

    <button type="submit" class='submit'>
        Entrar
    </button>

</form>

<div class='opcoes'>
    <a class="btn-voltar" href="/cadastrar-usuario">
        Cadastrar
    </a>

    <a class="btn-voltar" href="/">
        ← Voltar
    </a>
</div>

{% if erro %}
    <p class="erro">
        {{ erro }}
    </p>
{% endif %}
{% endblock %}
